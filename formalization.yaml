# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json
version: v0.4
project:
  name: BerryEsseenLean
  description: Lean 4 proofs of the eventual sharp Berry–Esseen bound, its explicit sample-size threshold,
    and sharpness, conditional on explicitly stated literature results.
  authors:
  - Codex (AI-assisted formalization under the manuscript author’s direction)
  license: Unspecified; no code distribution license has been selected.
sources:
- title: The Berry–Esseen Bound is Sharp for All Sufficiently Large Sample Sizes
  authors:
  - Hengzhi He
  - Guang Cheng
  id: https://arxiv.org/abs/2609.06358
  type: preprint
  relationship: formalizes
  location: Bundled reference/aop-sample.tex; see docs/STATEMENT_MAP.md
  note: The exact uploaded manuscript is the alignment target; see its SHA-256 in verification/release-check.json.
- title: Moment-type estimates with asymptotically optimal structure for the accuracy of the normal approximation
  authors:
  - Irina Shevtsova
  id: https://ami.uni-eszterhazy.hu/uploads/papers/finalpdf/AMI_39_from241to307.pdf
  type: journal article
  relationship: background
  location: 2012, Corollary 4.18, printed p. 303
- title: On the absolute constants in the Berry–Esseen inequality and its structural and nonuniform improvements
  authors:
  - Irina Shevtsova
  id: https://www.mathnet.ru/eng/ia252
  type: published results announcement
  relationship: background
  location: 2013, printed pp. 124–125
- title: An optimal Berry–Esseen type theorem for integrals of smooth functions
  authors:
  - Lutz Mattner
  - Irina Shevtsova
  id: https://doi.org/10.30757/ALEA.v16-19
  type: journal article
  relationship: background
  location: ALEA 16 (2019), printed p. 491, equations (1.5)–(1.8)
  note: Published precise restatements of Esseen results; no claim of rechecking the original 1956 proof.
- title: The optimal Berry-Esseen constant in the binomial case
  authors:
  - Jona Schulz
  id: https://d-nb.info/1197702695/34
  type: public doctoral dissertation
  relationship: background
  location: 2016, Theorem 1, printed p. 1
- title: Optimal Transport, Old and New
  authors:
  - Cédric Villani
  id: http://elenaher.dinauz.org/B07D.StFlour.pdf
  type: author manuscript
  relationship: background
  location: 13 June 2008; Definition 6.8(i) and Theorem 6.9, printed p. 108; Remark 6.5 (6.3), printed
    p. 107
  note: Exact checked version identified in reference/villani-2008-source.json. These locators refer to
    the 2008 manuscript.
status:
  scope: 361 mathematical modules; 31 named manuscript statement groups and 16 supplementary conjunct
    endpoints; see docs/VERIFICATION.md for the source-to-interface review boundary.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms:
  - propext
  - Classical.choice
  - Quot.sound
  main_results:
  - declaration: BerryEsseen.strict_main_theorem
    file: BerryEsseen/StrictResults.lean
    sorry_count: 0
    axioms:
    - propext
    - Classical.choice
    - Quot.sound
    literature_dependencies:
    - &id001
      statement: ClassicalBerryEsseenBounds.structural
      source: https://www.mathnet.ru/eng/ia252
    - &id002
      statement: ClassicalBerryEsseenBounds.remainder
      source: https://ami.uni-eszterhazy.hu/uploads/papers/finalpdf/AMI_39_from241to307.pdf
    - &id006
      statement: PublishedEsseenFixedLawAsymptotic.limit
      source: https://doi.org/10.30757/ALEA.v16-19
    - &id003
      statement: PublishedEsseenMoment.bound and equality
      source: https://doi.org/10.30757/ALEA.v16-19
    - &id004
      statement: PublishedBernoulliBound.strict_bound
      source: https://d-nb.info/1197702695/34
    - &id005
      statement: PublishedNonIIDBound.bound
      source: https://www.mathnet.ru/eng/ia252
    - statement: PublishedWassersteinThreeTopology.tendsto_iff
      source: http://elenaher.dinauz.org/B07D.StFlour.pdf
  - declaration: BerryEsseen.strict_explicit_theorem
    file: BerryEsseen/StrictResults.lean
    sorry_count: 0
    axioms:
    - propext
    - Classical.choice
    - Quot.sound
    literature_dependencies:
    - *id001
    - *id002
    - *id003
    - *id004
    - *id005
    - statement: PublishedNonuniformBound.bound
      source: https://www.mathnet.ru/eng/ia252
    - statement: PublishedWassersteinDuality.eq_dual
      source: http://elenaher.dinauz.org/B07D.StFlour.pdf
  - declaration: BerryEsseen.strict_sharpness
    file: BerryEsseen/StrictResults.lean
    sorry_count: 0
    axioms:
    - propext
    - Classical.choice
    - Quot.sound
    literature_dependencies:
    - *id006
automation:
  methods:
  - method: agent
    framework: Codex
    tool_setup: Lean 4.28.0, pinned mathlib, exact-type/axiom/proof-expression audits; scripts/verify.py
  notes: Revised under the manuscript author’s instructions to follow the original proof routes.
fidelity:
  divergences: Probability-law formulation using actual convolutions, with no separate arbitrary-probability-space
    iIndepFun wrapper. Literature inputs are explicitly parameterized standard reformulations. Some manuscript
    conjunctions use several endpoints; the bounded-extremizers full-conjunction wrapper is in Checks/BoundedFullStatementAudit.lean.
    See docs/ASSUMPTIONS.md and docs/STATEMENT_MAP.md.
review:
  status: agent-reviewed
  notes: Lean compilation and executable audits plus separate mathematical source/alignment review. No
    independent Comparator certificate or machine proof of equivalence with natural-language prose is
    claimed. Fresh release evidence is in verification/release-check.json.
